<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PRIMO Prototype</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="theme-color" content="#2463D3">
<meta property="og:type" content="website">
<meta property="og:title" content="PRIMO Prototype">
<meta property="og:description" content="ลองใช้ PRIMO: นำเข้ายอดขายจาก 4 ช่องทาง จับคู่สินค้าด้วย AI จำลองแผนด้วย Digital Twin และถาม Primo AI">
<meta property="og:image" content="og-image.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="description" content="PRIMO interactive prototype: import channel files, match SKUs with AI, simulate and decide.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&family=Manrope:wght@800&display=swap" rel="stylesheet">
<style>/* PRIMO prototype v2 — friendly marketplace feel: white base, soft rounded squares, pastel icon tiles, one blue.
   Layout: white sidebar + light page, cards on a 20px grid gap. */
:root{
  --blue:#2463D3;--blue-d:#1A4BA8;--blue-50:#EEF4FF;--blue-100:#DCE7FF;
  --bg:#F6F8FB;--card:#FFFFFF;--line:#ECEFF4;--line2:#F2F4F8;--ink:#1B2333;--ink2:#3A4458;--mute:#6B7486;--mute2:#98A1B2;
  --green:#12A26B;--green-50:#E7F8F0;--orange:#F07B1A;--orange-50:#FFF1E6;--red:#E5484D;--red-50:#FDEDEE;--yellow:#B98A00;--yellow-50:#FFF7DB;
  --violet:#7C5BEA;--violet-50:#F1EDFF;--pink:#E5487C;--pink-50:#FFEDF3;
  --r:16px;--r-lg:20px;--r-sm:12px;
  --sh:0 1px 2px rgba(16,24,40,.04),0 6px 18px -10px rgba(16,24,40,.12);--sh-lg:0 24px 60px -24px rgba(16,24,40,.28);
  --font:"Anuphan","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.ico{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ico.sm{width:15px;height:15px}.ico.lg{width:22px;height:22px}
/* ---------- shell ---------- */
#app{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100%}
.side{background:#fff;border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{display:flex;align-items:center;gap:10px;padding:2px 10px 18px;text-decoration:none;color:var(--ink)}
.logo b{font-family:Manrope,var(--font);font-weight:800;font-size:25px;letter-spacing:-.05em;color:var(--ink)}
.logo small{font-size:11px;font-weight:600;color:var(--blue);background:var(--blue-50);border-radius:999px;padding:2px 8px;margin-left:2px}
.ws{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r);background:var(--bg);margin-bottom:12px}
.ws .av{width:34px;height:34px;border-radius:11px;background:linear-gradient(140deg,#FFD9E4,#FFE9D2);display:grid;place-items:center;font-weight:700;color:#A3415C;font-size:13px}
.ws b{display:block;font-size:14px;line-height:1.2}.ws span{font-size:12px;color:var(--mute)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:14px;color:var(--ink2);text-decoration:none;font-weight:500;font-size:14.5px;transition:background .15s}
.nav a:hover{background:var(--bg)}
.nav a.on{background:var(--blue-50);color:var(--blue-d);font-weight:600}
.nav .tile{width:34px;height:34px;border-radius:11px}
.nav .cnt{margin-left:auto;font-size:12px;font-weight:700;background:var(--orange-50);color:var(--orange);border-radius:999px;padding:1px 9px}
.navlab{font-size:11.5px;font-weight:600;letter-spacing:.08em;color:var(--mute2);padding:14px 12px 6px;text-transform:uppercase}
.help{margin-top:auto;border-radius:var(--r-lg);background:linear-gradient(160deg,#EEF4FF,#F7F9FF);padding:14px;display:flex;gap:10px;align-items:center;font-size:13px;color:var(--ink2)}
.help svg{width:54px;height:54px;flex:none}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:rgba(246,248,251,.86);backdrop-filter:blur(10px);display:flex;align-items:center;gap:14px;padding:16px 32px;border-bottom:1px solid transparent}
.top h1{font-size:22px;font-weight:600;margin:0;letter-spacing:-.01em;line-height:1.25}
.top .sub{font-size:13px;color:var(--mute)}
.top .grow{flex:1}
.lang{display:flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{border:0;background:transparent;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--mute)}
.lang button.on{background:var(--blue);color:#fff}
.me{width:38px;height:38px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:700}
.page{padding:8px 32px 48px;display:flex;flex-direction:column;gap:20px;max-width:1400px;width:100%}
/* ---------- primitives ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh)}
.cardh{display:flex;align-items:center;gap:10px;padding:18px 22px 0}
.cardh h3{margin:0;font-size:16.5px;font-weight:600}
.cardh .hint{font-size:13px;color:var(--mute)}
.cardh .grow{flex:1}
.cardb{padding:16px 22px 22px}
.tile{display:grid;place-items:center;border-radius:12px;width:40px;height:40px;flex:none}
.t-blue{background:var(--blue-50);color:var(--blue)}.t-green{background:var(--green-50);color:var(--green)}.t-orange{background:var(--orange-50);color:var(--orange)}
.t-violet{background:var(--violet-50);color:var(--violet)}.t-pink{background:var(--pink-50);color:var(--pink)}.t-yellow{background:var(--yellow-50);color:var(--yellow)}.t-gray{background:#F1F3F7;color:#5B6576}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 18px;font-weight:600;font-size:14px;color:var(--ink);transition:all .15s;white-space:nowrap}
.btn:hover{border-color:#C9D6EE;color:var(--blue)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 6px 14px -6px rgba(36,99,211,.55)}
.btn.pri:hover{background:var(--blue-d)}
.btn.soft{background:var(--blue-50);border-color:var(--blue-50);color:var(--blue-d)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--mute)}
.btn.ok{background:var(--green);border-color:var(--green);color:#fff}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.lg{padding:13px 24px;font-size:15.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-green{background:var(--green-50);color:#0B7F53}.p-blue{background:var(--blue-50);color:var(--blue-d)}.p-orange{background:var(--orange-50);color:#C25E0C}.p-red{background:var(--red-50);color:#C2353A}.p-gray{background:#F1F3F7;color:#5B6576}.p-violet{background:var(--violet-50);color:var(--violet)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;color:var(--ink2);white-space:nowrap}
button.chip.on{border-color:var(--blue);background:var(--blue-50);color:var(--blue-d);font-weight:600}
.chl{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-weight:800;color:#fff;font-size:13px;flex:none}
.chl.sm{width:22px;height:22px;border-radius:7px;font-size:11px}
.muted{color:var(--mute)}.mute2{color:var(--mute2)}
.grid{display:grid;gap:20px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.kpi{padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.kpi .top2{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--mute);font-weight:500}
.kpi .v{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.kpi .d{font-size:13px;color:var(--mute)}
.bar{height:8px;border-radius:6px;background:var(--line2);overflow:hidden}.bar i{display:block;height:100%;border-radius:6px;background:var(--blue)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
.t th{text-align:left;font-size:12.5px;font-weight:600;color:var(--mute);padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:#FAFBFD}
.t td{padding:12px 14px;border-bottom:1px solid var(--line2);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t .r{text-align:right}
.tw{overflow-x:auto}
.sku{font-size:12px;font-weight:600;color:var(--blue-d);background:var(--blue-50);border-radius:8px;padding:2px 8px;white-space:nowrap}
.pimg{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.note{display:flex;gap:12px;align-items:flex-start;border-radius:var(--r);padding:14px 16px;font-size:14px}
.note.warn{background:var(--orange-50);color:#7A3C06}.note.info{background:var(--blue-50);color:var(--blue-d)}.note.ok{background:var(--green-50);color:#0B6B47}
.empty{padding:56px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty svg.fox{width:130px;height:130px}
svg.fox-m{width:110px;height:110px;display:block;margin:0 auto}
a.btn,a.btn:hover{text-decoration:none}
.empty h2{margin:6px 0 0;font-size:22px;font-weight:600}
.empty p{margin:0;color:var(--mute);max-width:520px}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.step{display:flex;gap:12px;align-items:flex-start;padding:16px;border-radius:var(--r);background:var(--bg)}
.step b{display:block;font-size:14.5px}.step span{font-size:13px;color:var(--mute)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-weight:600;font-size:13.5px;color:var(--ink2)}
.tabs button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tabs button .n{margin-left:6px;opacity:.7}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;min-width:260px}
.search input{border:0;outline:0;flex:1;background:transparent;font-size:14px}
input.in,select.in,textarea.in{border:1px solid var(--line);border-radius:12px;padding:9px 12px;background:#fff;font-size:14px;width:100%}
input.in:focus,select.in:focus,textarea.in:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-50)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13.5px;font-weight:600;color:var(--ink2)}
/* ---------- modal & toast ---------- */
#modal{position:fixed;inset:0;z-index:60;background:rgba(17,24,39,.36);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
#modal[hidden]{display:none}
.mbox{background:#fff;border-radius:24px;box-shadow:var(--sh-lg);width:min(920px,100%);max-height:calc(100vh - 48px);overflow:auto;display:flex;flex-direction:column}
.mbox.sm{width:min(520px,100%)}
.mh{display:flex;align-items:center;gap:12px;padding:20px 24px 12px}
.mh h2{margin:0;font-size:20px;font-weight:600}
.mh .x{margin-left:auto;border:0;background:var(--bg);width:36px;height:36px;border-radius:12px;display:grid;place-items:center}
.mb{padding:8px 24px 20px}
.mf{display:flex;gap:10px;justify-content:flex-end;padding:14px 24px 20px;border-top:1px solid var(--line2)}
.wz{display:flex;gap:8px;padding:0 24px 8px;flex-wrap:wrap}
.wz div{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--mute2)}
.wz div i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;background:var(--line2);font-size:12px}
.wz div.on{color:var(--blue-d)}.wz div.on i{background:var(--blue);color:#fff}
.wz div.done{color:var(--green)}.wz div.done i{background:var(--green-50);color:var(--green)}
.wz .sep{width:24px;height:1px;background:var(--line);align-self:center}
.pick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pick button{display:flex;gap:12px;align-items:center;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:var(--r);padding:14px}
.pick button:hover{border-color:#C9D6EE}
.pick button.on{border-color:var(--blue);background:var(--blue-50)}
.drop{border:2px dashed #CBD6EA;border-radius:var(--r-lg);padding:26px;text-align:center;background:#FAFCFF;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer}
.drop.on{border-color:var(--blue);background:var(--blue-50)}
.prog{height:10px;border-radius:6px;background:var(--line2);overflow:hidden}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),#5B93F5);border-radius:6px;transition:width .2s}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:#1B2333;color:#fff;border-radius:14px;padding:12px 18px;font-size:14px;box-shadow:var(--sh-lg);transition:opacity .25s;opacity:0;pointer-events:none;max-width:calc(100% - 32px)}
/* ---------- SKU matching ---------- */
.mrow{display:grid;grid-template-columns:minmax(0,1.25fr) 28px minmax(0,1.1fr) auto;gap:14px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:#fff;transition:border-color .2s,background .2s}
.mrow + .mrow{margin-top:10px}
.mrow.confirmed{background:#FBFEFC;border-color:#CDEFDE}
.mrow.rejected{opacity:.65}
.mrow .nm{font-weight:600;font-size:14.5px;line-height:1.35;word-break:break-word}
.mrow .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--mute);margin-top:4px}
.mrow .why{font-size:12.5px;color:var(--mute);margin-top:6px;display:flex;flex-direction:column;gap:2px}
.mrow .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.mrow select.in{padding:7px 10px;font-size:13.5px}
.cov{display:flex;align-items:center;gap:14px}
.ring{width:64px;height:64px;flex:none}
/* ---------- twin ---------- */
.rng{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:transparent}
.rng::-webkit-slider-runnable-track{height:8px;border-radius:6px;background:linear-gradient(to right,var(--blue) 0 var(--p,50%),var(--line) var(--p,50%) 100%)}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--blue);margin-top:-7px;box-shadow:0 4px 10px -2px rgba(36,99,211,.4)}
.rng::-moz-range-track{height:8px;border-radius:6px;background:var(--line)}
.rng::-moz-range-progress{height:8px;border-radius:6px;background:var(--blue)}
.rng::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--blue)}
.inp{padding:14px 0;border-bottom:1px solid var(--line2)}
.inp:last-child{border-bottom:0}
.inp .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.inp input.in{width:130px;text-align:right;font-weight:700}
.res{padding:18px 20px;border-radius:var(--r);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.res.hero{background:linear-gradient(150deg,var(--blue),var(--blue-d));color:#fff;border-color:transparent}
.res .v{font-size:28px;font-weight:700;letter-spacing:-.02em}
.res .d{font-size:13px}
/* ---------- chat ---------- */
.chat{display:grid;grid-template-columns:270px minmax(0,1fr);height:calc(100vh - 140px);min-height:560px;overflow:hidden;padding:0}
.chat .hist{border-right:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:8px;overflow:auto;background:#FBFCFE}
.chat .hist button.h{border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:12px;font-size:13.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat .hist button.h:hover{background:#fff}
.cmain{display:flex;flex-direction:column;min-width:0}
.msgs{flex:1;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:18px}
.msg{display:flex;gap:12px;max-width:760px;width:100%;margin:0 auto}
.msg.u{justify-content:flex-end}
.msg.u .b{background:var(--blue);color:#fff;border-radius:18px 18px 6px 18px;padding:11px 16px;max-width:80%}
.msg .av{width:36px;height:36px;flex:none}
.msg .a{flex:1;min-width:0;line-height:1.65}
.msg .a table{border-collapse:collapse;margin:8px 0;font-size:13.5px}
.msg .a td,.msg .a th{border:1px solid var(--line);padding:6px 10px;text-align:left}
.msg .a th{background:#FAFBFD;color:var(--mute);font-weight:600}
.sugg{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.sugg button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font-size:13.5px}
.sugg button:hover{border-color:var(--blue);color:var(--blue)}
.comp{padding:14px 24px 20px}
.comp .box{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:flex-end;border:1px solid var(--line);border-radius:20px;padding:8px 8px 8px 16px;box-shadow:var(--sh);background:#fff}
.comp textarea{flex:1;border:0;outline:0;resize:none;min-height:26px;max-height:120px;padding:6px 0;background:transparent}
.comp .send{width:40px;height:40px;border-radius:14px;border:0;background:var(--blue);color:#fff;display:grid;place-items:center}
/* ---------- memory ---------- */
.dcard{display:flex;flex-direction:column;gap:8px;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:var(--r);padding:16px;width:100%}
.dcard.on{border-color:var(--blue);background:var(--blue-50)}
.tl{display:flex;flex-direction:column}
.tl .s{display:grid;grid-template-columns:40px minmax(0,1fr);gap:14px;position:relative;padding-bottom:18px}
.tl .s::before{content:"";position:absolute;left:19px;top:40px;bottom:0;width:2px;background:var(--line)}
.tl .s:last-child::before{display:none}
.tl h5{margin:8px 0 4px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g21,.g3,.steps{grid-template-columns:minmax(0,1fr)}.mrow{grid-template-columns:minmax(0,1fr)}.mrow .arrow{display:none}.mrow .acts{justify-content:flex-start}}
@media (max-width:820px){#app{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;overflow-x:auto;align-items:center;padding:10px max(16px,env(safe-area-inset-left,0px))}.side .ws,.side .navlab,.side .help{display:none}.nav{flex-direction:row}.nav a{white-space:nowrap}.logo{padding:0 8px 0 0}
 .top{padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));flex-wrap:wrap}.page{padding:8px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
 .g4,.g2,.pick{grid-template-columns:minmax(0,1fr)}.chat{grid-template-columns:1fr;height:auto}.chat .hist{display:none}.search{min-width:0;width:100%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- revenue & profit chart ---------- */
.chhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:16px 20px 2px}
.chhead .hl{flex:1;min-width:220px;display:flex;flex-direction:column;gap:1px}
.chhead .lb{font-size:13px;font-weight:600;color:var(--mute)}
.chhead .bg{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.chhead .bg b{font-size:21px;font-weight:700;letter-spacing:-.01em;line-height:1.3}
.chg{font-size:12px;font-weight:700;border-radius:7px;padding:1px 7px;align-self:center}

   'Pick a product; it starts from last month\'s real sales. Drag the sliders to try a new price, discount, unit target or ad budget and the results update live. If you like it, click <b>Save as a decision</b> so you can compare with the real result later.'),
  memory:L(`ทุกการตัดสินใจเก็บ <b>บริบท หลักฐาน สิ่งที่คาดไว้</b> และ<b>ผลจริง</b> เมื่อรู้ผลแล้ว ใส่ตัวเลขในช่อง "ผลจริง" PRIMO จะบอกว่าได้กี่ % ของที่คาด ตอนนี้มี <b>${fu}</b> เรื่องรอติดตามผล`,
   `Each decision keeps its <b>context, evidence, expectation</b> and <b>real result</b>. Once you know the outcome, enter it under "Actual result" and PRIMO shows what % of the expectation you hit. <b>${fu}</b> waiting for follow-up.`),
  settings:L('เปลี่ยนภาษา หรือเริ่มใหม่ด้วยข้อมูลตัวอย่างได้ที่นี่ ข้อมูลทั้งหมดเก็บในเบราว์เซอร์นี้เท่านั้น','Switch language or restart with sample data here. Everything stays in this browser only.')};
 return T[p]||T.overview}
function reply(q,kind){const ql=q.toLowerCase();
 if(!kind){if(/ใช้ยังไง|ทำยังไง|ดูยังไง|how do|how to|how does|ช่วยอธิบาย|explain/.test(ql))kind='howto';else if(/คุ้ม|worth|scenario|สถานการณ์/.test(ql)&&twinCtx())kind='scenario';else kind=A.intent(q)}
 if(kind==='howto')return howto();if(kind==='scenario'){const c=twinCtx();return c?A.answer('scenario',c):A.answer('help')}
 return A.answer(kind,{q})}
/* ---------- conversation ---------- */
function chat(){return PD.state.chats.find(c=>c.id===D.chat)}
function ask(q,kind){if(D.typing||!q.trim())return;let c=chat();if(!c){c={id:'c'+Date.now(),title:q.slice(0,48),msgs:[],dock:true};PD.state.chats.unshift(c);D.chat=c.id}
 c.msgs.push({r:'u',t:esc(q)});D.typing=true;PD.save();paint();
 setTimeout(()=>{c.msgs.push({r:'a',t:reply(q,kind)});D.typing=false;PD.save();paint()},700)}
/* ---------- flat colour fox (same silhouette as the mascot: ink ear tips, white spark, ink eyes) ---------- */
const BODY='M44 170 C26 150 24 112 36 84 L31 34 C30 24 39 19 46 26 L78 56 C92 52 108 52 122 56 L154 26 C161 19 170 24 169 34 L164 84 C176 112 174 150 156 170 C138 190 62 190 44 170 Z',TAIL='M146 172 C196 178 208 120 186 80 C184 104 174 124 148 136 Z';
const INK='#0F1B33';let FID=0;
const P=(cx,cy,w,h,r)=>`<rect x="${cx-w/2}" y="${cy-h/2}" width="${w}" height="${h}" rx="${w/2}" transform="rotate(${r} ${cx} ${cy})"/>`;
const SPARK=(cx,cy,r)=>{const k=r*.3;return `<path d="M${cx} ${cy-r} C${cx+k*.35} ${cy-k} ${cx+k} ${cy-k*.35} ${cx+r} ${cy} C${cx+k} ${cy+k*.35} ${cx+k*.35} ${cy+k} ${cx} ${cy+r} C${cx-k*.35} ${cy+k} ${cx-k} ${cy+k*.35} ${cx-r} ${cy} C${cx-k} ${cy-k*.35} ${cx-k*.35} ${cy-k} ${cx} ${cy-r} Z" fill="#fff"/>`};
const EYES={
 idle:`<g class="eyes" fill="${INK}">${P(80,120,15,30,-8)+P(120,120,15,30,-8)}</g>`,
 think:`<g class="eyes" fill="${INK}">${P(88,110,13,24,-8)+P(126,110,13,24,-8)}</g>`,
 happy:`<path class="eyes" d="M68 124 Q80 106 92 124 M108 124 Q120 106 132 124" fill="none" stroke="${INK}" stroke-width="9" stroke-linecap="round"/>`,
 wink:`<g class="eyes"><g fill="${INK}">${P(80,120,14,28,-8)}</g><path d="M108 124 Q120 108 132 124" fill="none" stroke="${INK}" stroke-width="9" stroke-linecap="round"/></g>`,
 xx:`<path class="eyes" d="M66 106 L88 120 L66 134 M134 106 L112 120 L134 134" fill="none" stroke="${INK}" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>`,
 shades:`<g class="eyes"><path d="M54 106 H146 V114 H136 V126 H110 V114 H90 V126 H64 V114 H54 Z" fill="${INK}"/><rect x="70" y="114" width="6" height="6" fill="#fff"/><rect x="116" y="114" width="6" height="6" fill="#fff"/></g>`};
function foxC(col,eyes='idle',cls=''){const u='fc'+(FID++);
 return `<svg class="${cls}" viewBox="0 0 210 200" aria-hidden="true"><defs><clipPath id="${u}b"><path d="${BODY}"/></clipPath><clipPath id="${u}t"><path d="${TAIL}"/></clipPath></defs>
 <path d="${TAIL}" fill="${col}"/><g clip-path="url(#${u}t)"><path d="M150 40 H215 V112 L190 110 L170 96 Z" fill="${INK}"/></g>
 <path d="${BODY}" fill="${col}"/><g clip-path="url(#${u}b)" fill="${INK}"><path d="M0 0 H82 L58 30 L22 48 H0 Z M210 0 H118 L142 30 L178 48 H210 Z"/></g>${SPARK(100,82,12)}${EYES[eyes]||EYES.idle}</svg>`}
A.foxC=foxC;
/* the crew peeking behind the main fox */
const CREW=[['#F7861E','idle','c1'],['#FF4FA3','wink','c2'],['#1DC57A','xx','c3'],['#8B5CF6','shades','c4']];
function msgsHTML(){const c=chat();const pg=L(...A.TITLES[A.UI.page][0]);
 let h=`<div class="dk-m a">${foxC('#2463D3','happy','dk-fs')}<div class="t">${L(`สวัสดี ฉันคือ <b>Primo</b> ถามเรื่องธุรกิจได้เลยโดยไม่ต้องออกจากหน้า <b>${pg}</b>`,`Hi, I'm <b>Primo</b>. Ask about your business without leaving <b>${pg}</b>.`)}</div></div>`;
 if(c)h+=c.msgs.map(m=>m.r==='u'?`<div class="dk-m u"><div class="t">${m.t}</div></div>`:`<div class="dk-m a">${foxC('#2463D3','idle','dk-fs')}<div class="t">${m.t}</div></div>`).join('');
 if(D.typing)h+=`<div class="dk-m a">${foxC('#2463D3','think','dk-fs')}<div class="t"><span class="dk-dots"><i></i><i></i><i></i></span></div></div>`;return h}
function paint(){const m=document.getElementById('dkMsgs');if(!m)return;m.innerHTML=msgsHTML();const ms=[...m.children].filter(x=>x.matches('.msg,.dk-m'));const lr=ms[ms.length-1];const q0=lr&&lr.querySelector('.ai-rich')?ms[ms.length-2]:null;m.scrollTop=q0?q0.offsetTop-m.offsetTop-8:m.scrollHeight;
 const s=document.getElementById('dkSugg');if(s)s.innerHTML=D.typing?'':chips().map(([q,k])=>`<button data-act="dockAsk:${k}">${q}</button>`).join('');
 const mf=document.getElementById('dkMain');if(mf)mf.innerHTML=foxC('#2463D3',D.typing?'think':D.open?'happy':'idle','dk-svg')}
/* ---------- skeleton (rebuilt on page or language change, keeping state) ---------- */
function sync(){let el=document.getElementById('dock');if(!el){el=document.createElement('div');el.id='dock';document.body.appendChild(el)}
 el.hidden=A.UI.page==='ai';const keep=document.getElementById('dkIn');const val=keep?keep.value:'';const had=keep&&document.activeElement===keep;
 el.innerHTML=`<div class="dk ${D.open?'open':''} ${D.entered?'':'enter'}" id="dk">
 <div class="dk-panel" role="dialog" aria-label="Primo AI" ${D.open?'':'aria-hidden="true"'}>
  <div class="dk-ph"><span class="dk-ph-av">${A.mark(30)}</span><div style="flex:1;min-width:0"><b>Primo AI</b><span><i class="on"></i>${L('ออนไลน์ · ดูข้อมูลหน้า','Online · looking at')} ${L(...A.TITLES[A.UI.page][0])}</span></div>
   <button class="dk-ib" data-act="dockFull" title="${L('เปิดแบบเต็มหน้า','Open full chat')}" aria-label="${L('เปิดแบบเต็มหน้า','Open full chat')}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg></button>
   <button class="dk-ib" data-act="dockNew" title="${L('เริ่มคุยใหม่','New conversation')}" aria-label="${L('เริ่มคุยใหม่','New conversation')}">${ic('refresh','sm')}</button>
   <button class="dk-ib" data-act="dockClose" aria-label="${L('ปิด','Close')}">${ic('x','sm')}</button></div>
  <div class="dk-msgs" id="dkMsgs"></div><div class="dk-sugg" id="dkSugg"></div>
  <div class="dk-comp"><input id="dkIn" autocomplete="off" placeholder="${L('ถาม Primo เช่น สินค้าไหนใกล้หมด…','Ask Primo, e.g. which products are low…')}" tabindex="${D.open?0:-1}"><button class="dk-send" data-act="dockSend" aria-label="${L('ส่ง','Send')}" tabindex="${D.open?0:-1}">${ic('send','sm')}</button></div>
  <div class="dk-foot">${L('ต้นแบบ: คำตอบคำนวณจากตัวเลขจริงในพื้นที่ทำงาน','Prototype: answers are calculated from your workspace numbers')}</div></div>
 <div class="dk-hint" aria-hidden="true">${L('มีอะไรให้ช่วยไหม? ถามได้เลย','Need a hand? Ask me anything')}</div>
 <button class="dk-crew" data-act="dockToggle" aria-label="${L('คุยกับ Primo AI','Chat with Primo AI')}" aria-expanded="${D.open}">
  ${CREW.map(([c,e,k])=>`<span class="dk-f ${k}">${foxC(c,e,'dk-svg')}</span>`).join('')}
  <span class="dk-f main" id="dkMain"></span><i class="dk-on"></i><span class="dk-x">${ic('x','sm')}</span></button></div>`;
 D.entered=true;const inp=document.getElementById('dkIn');inp.value=val;
 inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();A.ACT.dockSend()}if(e.key==='Escape')close()};
 const dk=document.getElementById('dk');inp.oninput=()=>dk.classList.toggle('has',!!inp.value.trim());dk.classList.toggle('has',!!val.trim());
 if(!D.hinted&&!D.hintT)D.hintT=setTimeout(()=>{D.hintT=null;if(D.hinted||!document.getElementById('modal').hidden)return;D.hinted=true;
  const d=document.getElementById('dk');d&&!D.open&&d.classList.add('hint');setTimeout(()=>{const e=document.getElementById('dk');e&&e.classList.remove('hint')},5000)},1400);
 paint();if(had)inp.focus()}
function setTab(open){const dk=document.getElementById('dk');dk.querySelectorAll('#dkIn,.dk-send').forEach(b=>b.tabIndex=open?0:-1);dk.querySelector('.dk-crew').setAttribute('aria-expanded',String(open));
 const p=dk.querySelector('.dk-panel');open?p.removeAttribute('aria-hidden'):p.setAttribute('aria-hidden','true')}
function open(){if(D.open)return;D.open=true;const dk=document.getElementById('dk');dk.classList.add('open');dk.classList.remove('hint');setTab(true);paint();setTimeout(()=>{const i=document.getElementById('dkIn');i&&i.focus()},200)}
function close(){if(!D.open)return;D.open=false;const dk=document.getElementById('dk');if(!dk)return;dk.classList.remove('open');setTab(false);paint()}
/* show the hint once the first modal (welcome / data dump) is gone */
new MutationObserver(()=>{if(!D.hinted&&document.getElementById('modal').hidden&&document.getElementById('dk'))sync()}).observe(document.getElementById('modal'),{attributes:true,attributeFilter:['hidden']});
A.ACT.dockOpen=()=>open();A.ACT.dockClose=()=>close();A.ACT.dockToggle=()=>D.open?close():open();
A.ACT.dockSend=()=>{const i=document.getElementById('dkIn');const q=i.value;if(!q.trim())return;i.value='';document.getElementById('dk').classList.remove('has');ask(q)};
A.ACT.dockAsk=k=>{const c=chips().find(x=>x[1]===k);if(c)ask(c[0],k)};
A.ACT.dockNew=()=>{D.chat=null;paint()};
A.ACT.dockFull=()=>{if(D.chat)A.UI.chat.cur=D.chat;close();location.hash='ai'};
document.addEventListener('mousedown',e=>{if(!D.open)return;const d=document.getElementById('dock');const m=document.getElementById('modal');if(d&&!d.contains(e.target)&&!(m&&m.contains(e.target)))close()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&D.open&&document.getElementById('modal').hidden)close()});
const R0=A.render;A.render=()=>{R0();sync()};
A.start();
})();
</script></body></html>
